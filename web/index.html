        body { font-family: 'Segoe UI', sans-serif; color: #333; }
        
        /* Hero Banner */
        .about-hero {

        .section-title {

            position: relative;
            margin-bottom: 40px;
            text-align: center;
        }
        .section-title::after {
            content: '';
            width: 60px;
            height: 3px;
            background: #ff6600;
            position: absolute;
            bottom: -10px;
            left: 50%;
            transform: translateX(-50%);
        }

        /* Stats Counter */
        .stat-card {
            border: none;
            background: #fff5eb;
            transition: 0.3s;
        }
        .stat-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 5px 15px rgba(255, 102, 0, 0.2);
        }
        .stat-icon {
            font-size: 3rem;
            color: #ff6600;

        .stat-number {
            font-size: 2.5rem;
            font-weight: 800;
            color: #333;

        /* Team Members */
        .team-member {
            text-align: center;
            margin-bottom: 30px;
        }
        .team-img-box {
            width: 180px;
            height: 180px;
            margin: 0 auto 20px;
            border-radius: 50%;
            overflow: hidden;
            border: 4px solid #fff;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
            transition: 0.3s;
        }
        .team-member:hover .team-img-box {
            border-color: #ff6600;
            transform: scale(1.05);
        }
        .team-img-box img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .team-role {

            font-weight: 600;
            font-size: 0.9rem;
            text-transform: uppercase;
        }
    </style>
</head>
